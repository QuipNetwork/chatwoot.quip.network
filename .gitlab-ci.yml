#
# CI for chatwoot.quip.network: ONLY a weekly canary. The release path stays
# scripts/build-and-push.sh by hand (see its header); nothing here builds for
# release, and nothing here pushes.
#
#   canary  a scheduled pipeline (CI/CD > Schedules, weekly), or any pipeline
#           run with CANARY=1. scripts/canary.sh builds our app image on
#           Chatwoot's newest CE release and boots it in deploy/local against
#           the postgres + redis images the deployed spec pins, then checks
#           rails' /api and sidekiq. GitLab mails a failed scheduled pipeline
#           to the schedule's OWNER, so the schedule belongs to whoever should
#           hear about it.
#
# Where it runs: node07, our Firecracker runner (project runner 59688693, tags
# firecracker + amd64). Each job gets its own microVM with its own dockerd, and
# the job container talks to it through the mounted socket -- so the
# rehearsal's loopback-only edge ports are on the VM, not here, and the canary
# checks rails from inside the stack instead.
#
# This project is public, and so are its job logs: the canary prints image
# names, versions and check results only. Its rehearsal secrets are random,
# throwaway, and stay in deploy/local/.env, which nothing prints.

# No pipelines on pushes or merge requests: this repo has never had push CI,
# and the canary is the only job.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CANARY == "1"

canary:
  image: docker:27-cli
  tags: [firecracker, amd64]
  timeout: 45m
  variables:
    # rails 2 GiB + sidekiq 2 GiB + postgres 1 GiB + redis and the stand-ins,
    # plus the build. Below node07's 16384 max: other work shares the box.
    FC_VCPUS: "7"
    FC_MEM: "12288"
  before_script:
    - apk add --no-cache bash git python3 curl openssl
    - docker info --format 'docker daemon ready (server {{.ServerVersion}})'
  script:
    - scripts/canary.sh
  after_script:
    # A fresh container without before_script: canary.sh needs bash.
    - apk add --no-cache bash >/dev/null && scripts/canary.sh --down || true
