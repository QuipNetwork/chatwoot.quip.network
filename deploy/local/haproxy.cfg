# Local stand-in for Flux's domain manager (FDM) in front of rails, plus the
# plumbing the rehearsal needs. The wwwhttps frontend and the chatwoot backend
# copy FDM's customer-app config (flux-domain-manager haproxyTemplate.js):
# TLS ends here, the backend gets plain HTTP with X-Forwarded-For but NO
# X-Forwarded-Proto, and the backend timeouts are FDM's defaults unless the
# spec's timeout= env overrides them (FDM_TIMEOUT here; 25s is the strict case).
global
  log stdout format raw local0

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  http-reuse safe
  timeout connect 10000
  timeout client  120000
  timeout server  120000

frontend wwwhttps
  bind *:8443 ssl crt /certs/edge.pem alpn h2,http/1.1
  option forwardfor except 127.0.0.0/8
  http-response add-header Access-Control-Expose-Headers '*' unless { res.hdr(Access-Control-Expose-Headers) -m found }
  http-after-response add-header Access-Control-Allow-Origin "*" unless { res.hdr(Access-Control-Allow-Origin) -m found }
  default_backend chatwoot

backend chatwoot
  mode http
  balance roundrobin
  timeout http-request "${FDM_TIMEOUT}"
  timeout server "${FDM_TIMEOUT}"
  retries 3
  retry-on conn-failure response-timeout empty-response 500
  option redispatch 1
  server rails fluxrails_quipchatwoot:3000 inter 3s fall 2 rise 2 fastinter 500

# --- rehearsal plumbing, not part of the FDM mimic ---

# Presigned attachment URLs point at localhost:9000, which rails/sidekiq reach
# through their s3fwd sidecars and the browser reaches through here.
frontend s3
  mode tcp
  bind *:9000
  timeout client 1h
  default_backend minio

backend minio
  mode tcp
  timeout server 1h
  server minio minio:9000

frontend mailpit_ui
  bind *:8025
  default_backend mailpit

backend mailpit
  server mailpit mailpit:8025

# A page on a different origin than Chatwoot, as a customer site would be.
frontend widget_page
  bind *:8080
  http-request return status 200 content-type "text/html; charset=utf-8" file /usr/local/etc/haproxy/widget-test.html
