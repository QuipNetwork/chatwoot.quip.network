# Runs inside the rails and sidekiq network namespaces so that
# STORAGE_ENDPOINT=http://localhost:9000 reaches MinIO from the app AND from the
# browser (via the edge), which keeps presigned attachment URLs valid in both.
# Rehearsal only: on Flux the endpoint is Storj's public gateway.
global
  log stdout format raw local0

defaults
  log     global
  mode    tcp
  timeout connect 5s
  timeout client  1h
  timeout server  1h

listen s3
  bind 127.0.0.1:9000
  server minio minio:9000
